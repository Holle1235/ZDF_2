<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZDF – zurück zur App</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0e5e4e;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px;box-sizing:border-box;text-align:center}
  a{display:inline-block;margin-top:16px;padding:12px 20px;background:#34d399;color:#00201a;border-radius:999px;text-decoration:none;font-weight:600}
  code{word-break:break-all;font-size:12px;opacity:.8}
</style>
</head>
<body>
<div>
  <h1>ZDF</h1>
  <p>Bankfreigabe erteilt – zurück zur App …</p>
  <a id="open" href="#">ZDF öffnen</a>
  <p style="margin-top:24px;font-size:13px">Falls sich die App nicht öffnet: diese komplette URL kopieren und in ZDF unter „Bankkonto verbinden → Schritt 3“ einfügen.</p>
  <code id="url"></code>
</div>
<script>
  // Leitet nur code/state/error an die App weiter – diese Seite speichert oder sendet nichts.
  var target = "zdf://callback" + window.location.search;
  document.getElementById("open").href = target;
  document.getElementById("url").textContent = window.location.href;
  window.location.replace(target);
</script>
</body>
</html>
