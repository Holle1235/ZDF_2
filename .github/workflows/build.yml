name: Build & Release APK

# Jeder Push auf main oder einen claude/*-Branch baut eine neue Version und
# veröffentlicht sie als GitHub-Release. Die App findet sie dort und aktualisiert sich selbst.
on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur prüfen
        env:
          ZDF_SIGNING_PASSWORD: ${{ secrets.ZDF_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ZDF_SIGNING_PASSWORD" ]; then
            echo "::error::Secret ZDF_SIGNING_PASSWORD fehlt (Settings → Secrets and variables → Actions). Ohne festen Schlüssel könnten Updates nicht installiert werden."
            exit 1
          fi

      - name: Version festlegen
        run: |
          echo "ZDF_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ZDF_VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Tests & Build
        env:
          ZDF_SIGNING_PASSWORD: ${{ secrets.ZDF_SIGNING_PASSWORD }}
        run: ./gradlew testDebugUnitTest --tests 'de.zdf.app.CoreLogicTest' assembleRelease

      - name: APK bereitstellen
        run: cp app/build/outputs/apk/release/app-release.apk "ZDF-${ZDF_VERSION_NAME}.apk"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZDF_VERSION_NAME }}
          name: ZDF ${{ env.ZDF_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            ${{ github.event.head_commit.message }}

            Installation: APK unten herunterladen und öffnen. Bereits installierte Apps aktualisieren sich automatisch.
          files: ZDF-*.apk
