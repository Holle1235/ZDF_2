name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schlüssel (optional, aus Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ZDF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zdf.jks"
            echo "ZDF_KEYSTORE_FILE=$RUNNER_TEMP/zdf.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein ZDF_KEYSTORE_BASE64-Secret – APK wird mit Debug-Schlüssel signiert (Updates erfordern dann Neuinstallation)."
          fi

      - name: Tests & Build
        env:
          ZDF_KEYSTORE_PASSWORD: ${{ secrets.ZDF_KEYSTORE_PASSWORD }}
          ZDF_KEY_ALIAS: ${{ secrets.ZDF_KEY_ALIAS }}
          ZDF_KEY_PASSWORD: ${{ secrets.ZDF_KEY_PASSWORD }}
          ZDF_VERSION_CODE: ${{ github.run_number }}
          ZDF_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew testDebugUnitTest --tests 'de.zdf.app.CoreLogicTest' assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk ZDF-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZDF-apk
          path: ZDF-*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ZDF 1.0.${{ github.run_number }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: ZDF-*.apk
